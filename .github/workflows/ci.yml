name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: roster, POSTGRES_PASSWORD: roster, POSTGRES_DB: roster_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roster" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://roster:roster@localhost:5432/roster_test
      TEST_DATABASE_URL: postgres://roster:roster@localhost:5432/roster_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
