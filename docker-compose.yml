# Local production-like stack: Postgres (pgvector) + migrations + web + 2 workers.
#   cp .env.example .env
#   # fill the two required secrets (see README "Docker compose"):
#   #   ENCRYPTION_KEY=$(openssl rand -base64 32)   AUTH_SECRET=$(openssl rand -base64 48)
#   docker compose up --build
# Without them web and worker refuse to start and say which variable is missing.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: roster
      POSTGRES_PASSWORD: roster
      POSTGRES_DB: roster
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roster"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., target: worker }
    command: ["node", "--conditions=react-server", "dist/migrate.mjs"]
    init: true
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://roster:roster@db:5432/roster
    healthcheck: { disable: true }
    depends_on: { db: { condition: service_healthy } }

  web:
    build: { context: ., target: web }
    init: true
    stop_grace_period: 30s
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://roster:roster@db:5432/roster
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: { context: ., target: worker }
    # tini as PID 1 forwards SIGTERM to node; the worker drains in-flight jobs for up to 30s, so give it 60s.
    init: true
    stop_grace_period: 60s
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://roster:roster@db:5432/roster
    deploy: { replicas: 2 }
    depends_on: { migrate: { condition: service_completed_successfully } }

volumes:
  pgdata:
